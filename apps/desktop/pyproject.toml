[project]
name = "notion-sync-desktop"
version = "2.1.0"
requires-python = ">=3.12"
dependencies = [
  "notion-sync-engine",
  "PySide6>=6.7",
  "PySide6-Fluent-Widgets>=1.7",
  "platformdirs>=4",
  # 读文件夹里的 .sync-config.yaml（拿目标页面的 id）；引擎也是用它写这份配置的
  "pyyaml>=6",
  "watchdog>=6.0.0",
]

[project.gui-scripts]
notion-sync-desktop = "notion_sync_desktop.__main__:main"

[tool.uv.sources]
notion-sync-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_sync_desktop"]
