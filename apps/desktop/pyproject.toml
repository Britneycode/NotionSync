[project]
name = "notion-sync-desktop"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "notion-sync-engine",
  "PySide6>=6.7",
  "PySide6-Fluent-Widgets>=1.7",
  "platformdirs>=4",
]

[project.gui-scripts]
notion-sync-desktop = "notion_sync_desktop.__main__:main"

[tool.uv.sources]
notion-sync-engine = { workspace = true }

[dependency-groups]
dev = ["pytest-qt>=4.4", "pyinstaller>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_sync_desktop"]
