[project]
name = "notion-sync-engine"
version = "1.3.0"
requires-python = ">=3.12"
dependencies = [
  # 3.x 才有 data_sources.query / initial_data_source，设计文档 §6.2 写的 >=2.5,<3 是笔误
  "notion-client>=3.1",
  "pathspec>=0.12",
  "pyyaml>=6",
  # P0 暂时保留：state.py 的 PID 文件锁还在用；P1 换成 filelock 内核锁后删除
  "psutil>=5.9",
  "keyring>=25",
  "filelock>=3.13",
]

[project.scripts]
notion-sync = "sync_lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_lib"]
